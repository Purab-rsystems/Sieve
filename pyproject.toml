[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve"
version = "0.1.0"
description = "Pre-query and post-enrichment layer for the LeadDrip lead pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "typer>=0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
committee = ["llama-cpp-python>=0.3", "numpy>=1.24"]
dev = ["pytest>=7.4"]

[project.scripts]
sieve = "sieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
